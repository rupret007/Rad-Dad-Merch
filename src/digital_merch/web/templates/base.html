<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{csrf}}">
  <meta name="robots" content="noindex,nofollow">
  <title>{{title}} · Rad Dad digital merch</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to merch</a>
  <header class="site-header">
    <p class="brand"><a href="/catalog">Rad Dad</a> / Digital merch desk</p>
    <nav aria-label="Merch">
      <a href="/catalog">Catalog</a>
      <a href="/cart">Cart <span class="cart-count" data-cart-count>{{cart_count}}</span></a>
      <a href="/admin">Admin</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    {{flash}}
    {{body}}
  </main>
  <footer>
    <p>{{disclaimer}}</p>
    <p>Digital study only. No print job, shipment, payment, or merch pitch is created here.</p>
  </footer>
  <div class="sr-only" aria-live="polite" id="live-status"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
