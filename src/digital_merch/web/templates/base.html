<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{csrf}}">
  <meta name="robots" content="noindex,nofollow">
  <title>{{title}} · Rad Dad digital merch</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to merch</a>
  <header class="site-header">
    <p class="brand"><a href="/catalog">Rad Dad</a> / Digital merch desk</p>
    <nav aria-label="Merch">
      <a class="nav-link" href="/catalog">Catalog</a>
      <a class="nav-link cart-link" href="/cart">Hold cart <span class="cart-count" data-cart-count>{{cart_count}}</span></a>
      <a class="nav-link" href="/holds">Your holds</a>
      {{admin_nav}}
    </nav>
  </header>
  <main id="main" tabindex="-1">
    {{flash}}
    <div id="cart-update-status" class="cart-update-status" tabindex="-1" hidden>
      <p aria-live="polite" id="live-status"></p>
      <a id="cart-review-link" href="/cart" hidden>Review current hold cart</a>
    </div>
    {{body}}
  </main>
  <footer>
    <p>{{disclaimer}}</p>
    <p>Digital study only. No print job, shipment, payment, or merch pitch is created here.</p>
  </footer>
  <script src="/assets/app.js" defer></script>
</body>
</html>
