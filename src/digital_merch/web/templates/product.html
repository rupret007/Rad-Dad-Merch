<article class="product">
  <p class="eyebrow" style="color:{{color}}">{{revision}} · digital study</p>
  <h1>{{title}}</h1>
  <p class="lede">{{description}}</p>
  <dl class="facts">
    <div>
      <dt>SKU</dt>
      <dd>{{sku}}</dd>
    </div>
    <div>
      <dt>Study envelope</dt>
      <dd>{{extents}}</dd>
    </div>
    <div>
      <dt>Material visualization</dt>
      <dd>{{material}}</dd>
    </div>
    <div>
      <dt>Fulfillment</dt>
      <dd>Digital study request only</dd>
    </div>
  </dl>
  <figure class="study-frame">
    <img src="/assets/material-study.png" width="1800" height="1100" alt="Shared Current Three digital PETG material study used by this listing">
    <figcaption>This listing reuses the shared Current Three study. It does not invent a unique product photo.</figcaption>
  </figure>
  <form method="post" action="/cart" class="panel stack">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <input type="hidden" name="action" value="add">
    <input type="hidden" name="sku" value="{{sku}}">
    <label>
      Quantity
      <input type="number" name="qty" min="1" max="3" value="1">
    </label>
    <button type="submit">Add digital study to cart</button>
    <p class="hint">No charge, shipment, or printer job is created when you add this card.</p>
  </form>
</article>
