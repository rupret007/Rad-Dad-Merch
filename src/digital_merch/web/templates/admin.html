<section class="admin">
  <div class="admin-bar">
    <h1>Digital merch admin</h1>
    <form method="post" action="/admin/logout">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <button type="submit" class="ghost">Sign out</button>
    </form>
  </div>
  <p>Unpublished cards leave the public catalog and cannot enter a cart. Admin cannot start a print, shipment, or merch pitch from this desk.</p>
  <h2>Catalog</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">SKU</th>
          <th scope="col">Title</th>
          <th scope="col">Revision</th>
          <th scope="col">State</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        {{sku_rows}}
      </tbody>
    </table>
  </div>
  <h2>Study requests</h2>
  <div class="request-list">
    {{requests}}
  </div>
</section>
